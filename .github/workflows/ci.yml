name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Verify Dependencies
      run: go mod verify

    - name: Run Unit Tests
      run: go test -v -race -coverprofile=coverage.out ./...

    - name: Build Binary
      run: CGO_ENABLED=0 go build -ldflags="-s -w" -o fleetdeck cmd/fleetdeck/main.go
